<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bisan 京都店 席のご予約</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
  :root{--olive:#3F5234;--clay:#8C3B22;--ground:#F6F1E7;--ink:#231F1A;--muted:#5E574D;--line:#DDD3C2;--off:#E6E0D5;--offText:#8F877B}
  *{box-sizing:border-box}
  body{margin:0;background:var(--ground);color:var(--ink);font-family:"Zen Kaku Gothic New",sans-serif;-webkit-text-size-adjust:100%}
  header{background:var(--olive);color:var(--ground);padding:18px 20px 14px}
  header .sub{font-size:12px;letter-spacing:.12em;opacity:.85}
  header h1{margin:4px 0 0;font-family:"Shippori Mincho",serif;font-size:22px}
  .bar{display:flex;gap:6px;margin-top:10px}.bar i{flex:1;height:4px;border-radius:2px;background:rgba(246,241,231,.3)}.bar i.on{background:#E9C9A0}
  main{padding:20px 16px 120px;max-width:520px;margin:0 auto}
  h2{font-size:15px;margin:22px 0 10px}
  .note{font-size:12px;color:var(--muted);margin-top:8px;line-height:1.6}
  .days{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
  .days::-webkit-scrollbar{display:none}
  .chip{flex:0 0 54px;height:62px;border-radius:10px;border:1px solid var(--line);background:#fff;color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font:inherit;cursor:pointer}
  .chip small{font-size:11px}.chip b{font-size:15px}
  .chip.sel,.slot.sel{background:var(--olive);border-color:var(--olive);color:#fff}
  .chip:disabled,.slot:disabled{background:var(--off);color:var(--offText);cursor:default}
  .people{display:flex;align-items:center;gap:16px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 12px}
  .round{width:44px;height:44px;border-radius:22px;border:1px solid var(--olive);background:#fff;color:var(--olive);font-size:22px;font-family:inherit;cursor:pointer}
  .round.fill{background:var(--olive);color:#fff}
  .people output{flex:1;text-align:center;font-size:20px;font-weight:700}
  .slots{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
  .slot{height:50px;border-radius:10px;border:1px solid var(--line);background:#fff;color:var(--ink);font:inherit;font-weight:700;font-size:15px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer}
  .slot small{font-size:10px;font-weight:500}
  .card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px}
  .card .k{font-size:12px;color:var(--muted)}.card .v{font-size:18px;font-weight:700;margin-top:4px}
  label{display:block;font-size:14px;font-weight:700;margin:16px 0 6px}
  input,textarea{width:100%;border:1px solid #BFB4A2;border-radius:10px;padding:12px 14px;font:inherit;font-size:16px;background:#fff}
  input{height:48px}textarea{resize:none}
  .info{font-size:12px;line-height:1.7;color:var(--muted);background:#EFE7D8;border-radius:10px;padding:12px;margin-top:18px}
  footer{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:12px 16px calc(14px + env(safe-area-inset-bottom));display:flex;gap:10px}
  .btn{height:52px;border-radius:26px;border:none;font:inherit;font-size:16px;font-weight:700;cursor:pointer}
  .btn.main{flex:1;background:var(--clay);color:#fff}.btn.main:disabled{background:#B9ADA0}
  .btn.sub{width:110px;background:#fff;border:1px solid var(--olive);color:var(--olive)}
  .done{text-align:center;padding-top:20px}
  .done .ok{width:72px;height:72px;border-radius:36px;background:var(--olive);display:flex;align-items:center;justify-content:center;margin:0 auto 16px}
  .done h3{font-family:"Shippori Mincho",serif;font-size:22px;margin:0 0 16px}
  .err{color:var(--clay);font-size:14px;font-weight:700;margin-top:12px;min-height:1em}
  .hide{display:none!important}
  .loading{padding:40px 0;text-align:center;color:var(--muted)}
</style>
</head>
<body>
<header>
  <div class="sub">パレスチナ料理</div>
  <h1>Bisan 京都店　席のご予約</h1>
  <div class="bar"><i class="on" id="b1"></i><i id="b2"></i><i id="b3"></i></div>
</header>

<main>
  <div id="loading" class="loading">読み込み中…</div>

  <!-- STEP1 日時・人数 -->
  <section id="step1" class="hide">
    <h2>1. 日付</h2>
    <div class="days" id="days"></div>
    <div class="note">火曜は定休日です。金・土は夜（〜21:00）も営業しています。</div>

    <h2>2. 人数</h2>
    <div class="people">
      <button class="round" id="minus" aria-label="人数を減らす">−</button>
      <output id="people">2 名</output>
      <button class="round fill" id="plus" aria-label="人数を増やす">＋</button>
    </div>
    <div class="note" id="maxNote"></div>

    <h2 id="timeTitle">3. 時間</h2>
    <div class="slots" id="slots"></div>
    <div class="note" id="slotNote"></div>
  </section>

  <!-- STEP2 お客様情報 -->
  <section id="step2" class="hide">
    <div class="card"><div class="k">ご予約内容</div><div class="v" id="summary"></div></div>
    <label for="nm">お名前</label>
    <input id="nm" type="text" autocomplete="name" placeholder="例）山田 花子">
    <label for="tel">電話番号</label>
    <input id="tel" type="tel" autocomplete="tel" placeholder="例）090-1234-5678">
    <label for="memo">ご要望（任意）</label>
    <textarea id="memo" rows="3" placeholder="アレルギー、ベジタリアン、お祝いなど"></textarea>
    <div class="info">この予約はリクエストです。お店が確認して、このLINEに確定のご連絡をお送りします。</div>
  </section>

  <!-- STEP3 完了 -->
  <section id="step3" class="hide done">
    <div class="ok"><svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5L20 7"/></svg></div>
    <h3>リクエストを受け付けました</h3>
    <div class="card"><div class="v" id="doneWhen"></div></div>
    <p style="font-size:14px;line-height:1.8">まだ予約は確定していません。<br>お店が確認後、このLINEに<br>「予約確定」のメッセージをお送りします。</p>
  </section>

  <div class="err" id="err" role="alert"></div>
</main>

<footer id="foot" class="hide">
  <button class="btn sub hide" id="back">戻る</button>
  <button class="btn main" id="next" disabled>次へ（お客様情報）</button>
</footer>

<script>
/* ===== ここを設定 ===== */
var CONFIG = {
  LIFF_ID: 'ここにLIFF ID',                 // 例: 2001234567-AbCdEfGh
  GAS_URL: 'https://script.google.com/macros/s/AKfycbwHymunhy03Jy9Ud4jxqqbuO7kQfmx45LUVUsu6z4Ipw56S_3H4XbPa27XFZqUaR1k/exec'
};
/* ===================== */

var state = { step: 1, date: null, time: null, people: 2, maxPeople: 8, days: [], slots: [] };
var $ = function (id) { return document.getElementById(id); };

function showErr(msg) { $('err').textContent = msg || ''; }

function api(params) {
  var q = Object.keys(params).map(function (k) { return k + '=' + encodeURIComponent(params[k]); }).join('&');
  return fetch(CONFIG.GAS_URL + '?' + q).then(function (r) { return r.json(); });
}

function setStep(n) {
  state.step = n;
  ['step1', 'step2', 'step3'].forEach(function (id, i) { $(id).classList.toggle('hide', i + 1 !== n); });
  $('b2').classList.toggle('on', n >= 2); $('b3').classList.toggle('on', n >= 3);
  $('foot').classList.toggle('hide', n === 3);
  $('back').classList.toggle('hide', n !== 2);
  $('next').textContent = n === 1 ? '次へ（お客様情報）' : '予約をリクエストする';
  $('next').disabled = n === 1 ? !state.time : false;
  showErr('');
  window.scrollTo(0, 0);
}

function whenLabel() {
  var d = state.days.filter(function (x) { return x.date === state.date; })[0];
  return d ? d.md + '（' + d.wd + '） ' + (state.time || '') + '　' + state.people + '名' : '';
}

function renderDays() {
  var box = $('days'); box.innerHTML = '';
  state.days.forEach(function (d) {
    var b = document.createElement('button');
    b.className = 'chip' + (d.date === state.date ? ' sel' : '');
    b.disabled = !d.open;
    b.setAttribute('aria-label', d.md + '（' + d.wd + '）' + (d.open ? '' : ' 休業'));
    b.innerHTML = '<small>' + d.wd + '</small><b>' + d.md + '</b>';
    b.onclick = function () { state.date = d.date; state.time = null; renderDays(); loadSlots(); };
    box.appendChild(b);
  });
}

function renderSlots() {
  var box = $('slots'); box.innerHTML = '';
  var any = false;
  state.slots.forEach(function (s) {
    var ok = s.left >= state.people;
    if (ok) any = true;
    var h = Number(s.time.split(':')[0]);
    var kind = h >= 17 ? 'ディナー' : (h >= 14 ? 'カフェ' : 'ランチ');
    var b = document.createElement('button');
    b.className = 'slot' + (s.time === state.time ? ' sel' : '');
    b.disabled = !ok;
    b.innerHTML = '<span>' + s.time + '</span><small>' + (ok ? kind : (s.left > 0 ? '残' + s.left + '席' : '満席')) + '</small>';
    b.onclick = function () { state.time = s.time; renderSlots(); $('next').disabled = false; };
    box.appendChild(b);
  });
  $('slotNote').textContent = state.slots.length && !any ? 'この日は空きがありません。別の日をお選びください。' : '';
  $('next').disabled = !state.time;
}

function loadSlots() {
  $('slots').innerHTML = '<div class="note">空き状況を確認中…</div>';
  var d = state.days.filter(function (x) { return x.date === state.date; })[0];
  $('timeTitle').textContent = '3. 時間（' + d.md + '・' + d.wd + '）';
  api({ action: 'slots', date: state.date }).then(function (res) {
    if (!res.ok) throw new Error(res.error);
    state.slots = res.slots; renderSlots();
  }).catch(function (e) { showErr('空き状況を読み込めませんでした。' + e.message); });
}

function setPeople(n) {
  state.people = Math.max(1, Math.min(state.maxPeople, n));
  $('people').textContent = state.people + ' 名';
  if (state.time) {
    var s = state.slots.filter(function (x) { return x.time === state.time; })[0];
    if (!s || s.left < state.people) state.time = null;
  }
  renderSlots();
}

function submit() {
  var name = $('nm').value.trim(), tel = $('tel').value.trim();
  if (!name || !tel) { showErr('お名前と電話番号を入れてください。'); return; }
  $('next').disabled = true; $('next').textContent = '送信中…';
  var body = {
    action: 'reserve', idToken: liff.getIDToken(), date: state.date, time: state.time,
    people: state.people, name: name, tel: tel, memo: $('memo').value.trim()
  };
  fetch(CONFIG.GAS_URL, { method: 'POST', body: JSON.stringify(body) })
    .then(function (r) { return r.json(); })
    .then(function (res) {
      if (!res.ok) throw new Error(res.error);
      $('doneWhen').textContent = res.when;
      setStep(3);
    })
    .catch(function (e) {
      showErr(e.message || '送信できませんでした。');
      $('next').disabled = false; $('next').textContent = '予約をリクエストする';
    });
}

$('minus').onclick = function () { setPeople(state.people - 1); };
$('plus').onclick = function () { setPeople(state.people + 1); };
$('back').onclick = function () { setStep(1); };
$('next').onclick = function () {
  if (state.step === 1 && state.time) { $('summary').textContent = whenLabel(); setStep(2); }
  else if (state.step === 2) submit();
};

liff.init({ liffId: CONFIG.LIFF_ID }).then(function () {
  if (!liff.isLoggedIn()) { liff.login(); return; }
  return liff.getProfile().then(function (p) {
    if (p && p.displayName && !$('nm').value) $('nm').placeholder = '例）' + p.displayName;
  }).catch(function () {}).then(function () { return api({ action: 'days' }); });
}).then(function (res) {
  if (!res) return;
  if (!res.ok) throw new Error(res.error);
  state.days = res.days; state.maxPeople = res.maxPeople;
  $('maxNote').textContent = (res.maxPeople + 1) + '名以上はLINEのトークでご相談ください。';
  var first = res.days.filter(function (d) { return d.open; })[0];
  $('loading').classList.add('hide'); $('step1').classList.remove('hide'); $('foot').classList.remove('hide');
  if (first) { state.date = first.date; renderDays(); loadSlots(); } else renderDays();
}).catch(function (e) {
  $('loading').textContent = '読み込めませんでした。LINEアプリから開き直してください。（' + e.message + '）';
});
</script>
</body>
</html>
