<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Bisan スタッフ</title>
<link rel="preconnect" href="https://script.google.com">
<link rel="preconnect" href="https://script.googleusercontent.com">
<style>
  :root{--olive:#3F5234;--clay:#8C3B22;--wait:#A0612F;--ground:#F6F1E7;--ink:#231F1A;--muted:#5E574D;--line:#DDD3C2;
    --pend:#F3DCCB;--pendInk:#7A321C;--ok:#DCE5D2;--okInk:#2F3E26;--waitBg:#F1E0CC;--waitInk:#6E3F17;--off:#E6E0D5;--offInk:#4A433A;--warn:#F3DCCB;--warnInk:#7A321C}
  *{box-sizing:border-box}
  body{margin:0;background:var(--ground);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP","Yu Gothic",Meiryo,sans-serif;-webkit-text-size-adjust:100%}
  button{font:inherit;cursor:pointer}
  .hide{display:none!important}
  /* ログイン */
  .login{max-width:360px;margin:0 auto;padding:40px 18px}
  .login h1{font-family:"Hiragino Mincho ProN","Yu Mincho",serif;font-size:26px;margin:0 0 6px;color:var(--olive);text-align:center}
  .login p{color:var(--muted);font-size:14px;margin:0 0 18px;text-align:center}
  .dots{display:flex;gap:12px;justify-content:center;margin:10px 0 18px}
  .dots i{width:16px;height:16px;border-radius:8px;border:2px solid var(--olive)}
  .dots i.on{background:var(--olive)}
  .pad{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
  .pad button{height:60px;border-radius:14px;border:1px solid var(--line);background:#fff;font-size:24px;font-weight:700;color:var(--ink)}
  .pad .sub{font-size:15px;color:var(--muted)}
  .pad .go{background:var(--olive);color:#fff;border-color:var(--olive);font-size:17px}
  .err{color:var(--clay);font-weight:700;margin-top:12px;min-height:1.2em;font-size:14px;text-align:center}
  /* ヘッダー */
  header{background:var(--olive);color:#fff;padding:10px 16px 10px;position:sticky;top:0;z-index:5}
  .hrow{display:flex;align-items:center;gap:8px;max-width:760px;margin:0 auto}
  .hrow h1{margin:0;font-size:17px;flex:1}
  .me{font-size:13px;opacity:.9}
  .hbtn{height:30px;border-radius:15px;border:1px solid rgba(255,255,255,.5);background:transparent;color:#fff;font-size:12px;padding:0 10px}
  .seg{display:grid;grid-template-columns:1fr 1fr;gap:0;max-width:760px;margin:10px auto 0;background:rgba(0,0,0,.18);border-radius:12px;padding:3px}
  .seg button{height:38px;border:none;border-radius:10px;background:transparent;color:#fff;font-size:15px;font-weight:700}
  .seg button.on{background:#fff;color:var(--olive)}
  .seg .cnt,.tabs .cnt{display:inline-block;min-width:18px;height:18px;line-height:18px;border-radius:9px;background:var(--clay);color:#fff;font-size:11px;font-weight:700;margin-left:4px;padding:0 5px;vertical-align:1px}
  .tabs{display:flex;gap:5px;max-width:760px;margin:8px auto 0;overflow-x:auto;scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tabs button{flex:1 0 auto;height:34px;border-radius:17px;border:1px solid rgba(255,255,255,.5);background:transparent;color:#fff;font-size:12.5px;padding:0 8px;white-space:nowrap}
  .tabs button.on{background:#fff;color:var(--olive);font-weight:700}
  .sync{font-size:11px;opacity:.9;max-width:760px;margin:6px auto 0;min-height:1em}
  main{max-width:760px;margin:0 auto;padding:4px 16px 40px}
  .empty{color:var(--muted);text-align:center;padding:36px 0;font-size:14px;line-height:1.7}
  .day{font-size:13px;font-weight:700;color:var(--olive);margin:18px 0 4px}
  .toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:20px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:10;max-width:90%}
  .toast.show{opacity:1}
  /* 予約 */
  .card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;margin-top:10px}
  .top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .when{flex:1;font-size:17px;font-weight:700}
  .badge{font-size:12px;font-weight:700;padding:4px 10px;border-radius:12px}
  .b-pend{background:var(--pend);color:var(--pendInk)}.b-ok{background:var(--ok);color:var(--okInk)}.b-wait{background:var(--waitBg);color:var(--waitInk)}.b-off{background:var(--off);color:var(--offInk)}
  .lang{font-size:11px;font-weight:700;padding:3px 8px;border-radius:10px;background:#E4E9F2;color:#2E3F5C}
  .who{font-size:15px;margin-top:6px}
  .meta{font-size:13px;color:var(--muted);margin-top:4px;line-height:1.6}
  .meta a{color:var(--clay)}
  .meta .by{color:var(--olive);font-weight:700}
  .acts{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
  .acts button{height:44px;border-radius:22px;font-size:14px;font-weight:700;padding:0 16px}
  .ok{flex:1;border:none;background:var(--olive);color:#fff}
  .wt{border:1px solid var(--wait);background:#fff;color:var(--wait)}
  .cx{border:1px solid #8F877B;background:#fff;color:#4A433A}
  .acts button.armed{background:var(--wait);border-color:var(--wait);color:#fff}
  .reason{margin-top:10px;background:#FBF7F1;border:1px solid var(--line);border-radius:10px;padding:10px}
  .reason label{display:block;font-size:13px;font-weight:700;margin-bottom:6px}
  .reason textarea{width:100%;border:1px solid #BFB4A2;border-radius:8px;padding:8px 10px;font:inherit;font-size:15px;resize:vertical;min-height:64px}
  .reason .row{display:flex;gap:8px;margin-top:8px}
  .reason .go{flex:1;height:42px;border:none;border-radius:21px;background:#4A433A;color:#fff;font-weight:700;font-size:14px}
  .reason .no{height:42px;border:1px solid var(--line);border-radius:21px;background:#fff;color:var(--muted);padding:0 16px}
  .hist{display:flex;gap:10px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-top:8px;align-items:flex-start}
  .hist .t{font-size:12px;color:var(--muted);min-width:44px;padding-top:2px}
  .hist .b{flex:1;min-width:0;font-size:14px;line-height:1.5}
  .hist .b small{display:block;color:var(--muted);font-size:12px}
  .op{font-weight:700}
  .op.o1{color:var(--olive)}.op.o2{color:var(--wait)}.op.o3{color:#4A433A}.op.o4{color:#2E3F5C}
  /* 在庫 */
  .cats{display:flex;gap:6px;overflow-x:auto;padding:12px 0 4px;scrollbar-width:none}
  .cats::-webkit-scrollbar{display:none}
  .cats button{flex:0 0 auto;height:34px;padding:0 14px;border-radius:17px;border:1px solid var(--line);background:#fff;font-size:13px;color:var(--ink)}
  .cats button.on{background:var(--olive);border-color:var(--olive);color:#fff}
  .search input{width:100%;height:42px;border:1px solid var(--line);border-radius:10px;padding:0 12px;font-size:16px;background:#fff;margin-top:6px}
  .item{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:10px}
  .item.low{border-color:#E2C56B;background:#FFFBEA}
  .item.out{border-color:var(--clay);background:#FFF4EE}
  .itop{display:flex;align-items:center;gap:10px}
  .name{flex:1;font-weight:700;font-size:15px}
  .name small{display:block;font-weight:400;color:var(--muted);font-size:11px;margin-top:2px}
  .stock{font-size:26px;font-weight:700;min-width:54px;text-align:right}
  .stock.pending{color:var(--clay)}
  .zb{font-size:11px;font-weight:700;background:var(--warn);color:var(--warnInk);padding:3px 8px;border-radius:10px;margin-left:6px}
  .zb.out{background:var(--clay);color:#fff}
  .zacts{display:flex;gap:6px;margin-top:10px}
  .zacts button{height:44px;border-radius:10px;font-size:14px;font-weight:700;border:1px solid var(--olive);background:#fff;color:var(--olive)}
  .zacts .use{flex:1;background:var(--olive);color:#fff}
  .zacts .in,.zacts .cnt{width:78px}
  .panel{display:flex;gap:6px;margin-top:8px;align-items:center}
  .panel input{flex:1;min-width:0;height:44px;border:1px solid #BFB4A2;border-radius:10px;padding:0 12px;font-size:18px}
  .panel button{height:44px;padding:0 14px;border-radius:10px;border:none;background:var(--clay);color:#fff;font-weight:700;font-size:14px}
  .panel .x{background:#fff;border:1px solid var(--line);color:var(--muted)}
  .inbox{margin-top:8px;background:var(--ground);border-radius:10px;padding:10px}
  .inbox label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin:6px 0 3px}
  .inbox input{width:100%;height:44px;border:1px solid #BFB4A2;border-radius:10px;padding:0 12px;font-size:17px;background:#fff}
  .inbox .dates{display:flex;gap:8px}
  .inbox .dates>div{flex:1;min-width:0}
  .inbox .r2{display:flex;gap:8px;margin-top:10px}
  .inbox .r2 button{flex:1;height:44px;border-radius:10px;border:none;background:var(--clay);color:#fff;font-weight:700}
  .inbox .r2 .x{flex:0 0 90px;background:#fff;border:1px solid var(--line);color:var(--muted)}
  .row{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-top:8px}
  .row.out{border-color:var(--clay);background:#FFF4EE}
  .row.low{border-color:#E2C56B;background:#FFFBEA}
  .row .n{flex:1;min-width:0;font-weight:700;font-size:15px}
  .row .n small{display:block;font-weight:400;color:var(--muted);font-size:12px;margin-top:2px}
  .row .v{text-align:right;font-size:12px;color:var(--muted)}
  .row .v b{display:block;font-size:18px;color:var(--ink)}
  .row .v b.z{color:var(--clay)}
  .grp{margin:18px 0 4px;font-size:13px;font-weight:700;color:var(--muted)}
  table{width:100%;border-collapse:collapse;background:#fff;border-radius:12px;overflow:hidden;margin-top:12px;font-size:13px}
  th,td{padding:8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
  th{background:#EFE7D8;font-size:12px}
</style>
</head>
<body>

<!-- ログイン -->
<section id="login" class="login hide">
  <h1>Bisan スタッフ</h1>
  <p>スタッフコード（6桁）を入れてください</p>
  <div class="dots" id="dots"></div>
  <div class="pad" id="pad"></div>
  <div class="err" id="loginErr" role="alert"></div>
</section>

<!-- 本体 -->
<div id="app" class="hide">
  <header>
    <div class="hrow"><h1>Bisan スタッフ</h1><span class="me" id="meName"></span><button class="hbtn" id="reload">更新</button><button class="hbtn" id="logout">ログアウト</button></div>
    <div class="seg" id="seg">
      <button data-sec="resv" class="on">予約<span class="cnt hide" id="segResv"></span></button>
      <button data-sec="zaiko">在庫<span class="cnt hide" id="segZaiko"></span></button>
    </div>
    <nav class="tabs" id="tabsResv">
      <button data-tab="pend" class="on">承認待ち<span class="cnt hide" id="cPend"></span></button>
      <button data-tab="today">今日<span class="cnt hide" id="cToday"></span></button>
      <button data-tab="ok">確定</button>
      <button data-tab="wait">キャン待ち</button>
      <button data-tab="hist">履歴</button>
    </nav>
    <nav class="tabs hide" id="tabsZaiko">
      <button data-ztab="list" class="on">在庫</button>
      <button data-ztab="out">在庫切れ<span class="cnt hide" id="cOut"></span></button>
      <button data-ztab="in">入荷記録</button>
      <button data-ztab="log">履歴</button>
    </nav>
    <div class="sync" id="sync"></div>
  </header>

  <main id="resvView"></main>
  <div id="zaikoView" class="hide">
    <main id="zList">
      <div class="cats" id="cats"></div>
      <div class="search"><input id="q" type="search" placeholder="品目を探す" aria-label="品目を探す"></div>
      <div id="items"></div>
    </main>
    <main id="zOut" class="hide"></main>
    <main id="zIn" class="hide"></main>
    <main id="zLog" class="hide"></main>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
var API = 'https://script.google.com/macros/s/AKfycbwHymunhy03Jy9Ud4jxqqbuO7kQfmx45LUVUsu6z4Ipw56S_3H4XbPa27XFZqUaR1k/exec';

var $ = function (id) { return document.getElementById(id); };
function store(k, v) { try { if (v === undefined) return localStorage.getItem(k); if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) { return null; } }
function toast(t) { var el = $('toast'); el.textContent = t; el.classList.add('show'); clearTimeout(toast._t); toast._t = setTimeout(function () { el.classList.remove('show'); }, 2200); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function pad2(n) { return ('0' + n).slice(-2); }
function ymd(d) { return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }
function today() { return ymd(new Date()); }
function nowFull() { var d = new Date(); return ymd(d) + ' ' + pad2(d.getHours()) + ':' + pad2(d.getMinutes()); }
function md(s) { if (!s) return ''; var p = String(s).slice(0, 10).split('-'); return p.length < 3 ? s : Number(p[1]) + '/' + Number(p[2]); }
var WD = ['日', '月', '火', '水', '木', '金', '土'];
function dayLabel(s) {
  var p = s.split('-'); if (p.length < 3) return s;
  var d = new Date(+p[0], p[1] - 1, +p[2]), y = new Date(); y.setDate(y.getDate() - 1);
  return (s === today() ? '今日 ' : s === ymd(y) ? '昨日 ' : '') + md(s) + '（' + WD[d.getDay()] + '）';
}
function cnt(id, n) { var el = $(id); if (!el) return; el.textContent = n; el.classList.toggle('hide', !n); }

var TOKEN = store('bisanStaffToken'), ME = JSON.parse(store('bisanStaffMe') || 'null');
function post(body) {
  body.token = TOKEN;
  return fetch(API, { method: 'POST', body: JSON.stringify(body) }).then(function (r) { return r.json(); }).then(function (res) {
    if (res && res.login) { logout(); throw new Error('もう一度ログインしてください'); }
    return res;
  });
}

/* ========== ログイン（スタッフコード） ========== */
var CODE = '';
function showLogin() {
  $('app').classList.add('hide'); $('login').classList.remove('hide');
  CODE = ''; renderPad();
}
function renderPad() {
  var keys = ['1', '2', '3', '4', '5', '6', '7', '8', '9', '消す', '0', 'OK'];
  $('pad').innerHTML = keys.map(function (k) {
    return '<button data-key="' + k + '" class="' + (k === 'OK' ? 'go' : k === '消す' ? 'sub' : '') + '" aria-label="' + k + '">' + k + '</button>';
  }).join('');
  renderDots();
}
function renderDots() {
  var h = ''; for (var i = 0; i < 6; i++) h += '<i class="' + (i < CODE.length ? 'on' : '') + '"></i>';
  $('dots').innerHTML = h;
}
function doLogin() {
  if (CODE.length !== 6) { $('loginErr').textContent = 'スタッフコードは6桁です'; return; }
  $('loginErr').textContent = '確認中…';
  fetch(API, { method: 'POST', body: JSON.stringify({ action: 'staff_login', code: CODE }) }).then(function (r) { return r.json(); }).then(function (res) {
    CODE = ''; renderDots();
    if (!res.ok) { $('loginErr').textContent = res.error; return; }
    TOKEN = res.token; ME = res.me;
    store('bisanStaffToken', TOKEN); store('bisanStaffMe', JSON.stringify(ME));
    $('loginErr').textContent = '';
    startApp();
  }).catch(function () { CODE = ''; renderDots(); $('loginErr').textContent = '通信できませんでした。もう一度お試しください。'; });
}
function logout() {
  TOKEN = null; ME = null; store('bisanStaffToken', null); store('bisanStaffMe', null);
  showLogin();
}

/* ========== 共通 ========== */
var SEC = store('bisanStaffSec') || 'resv';
function startApp() {
  $('login').classList.add('hide'); $('app').classList.remove('hide');
  $('meName').textContent = ME.name;
  setSec(SEC);
  if (R) renderResv(); else $('resvView').innerHTML = '<div class="empty">読み込み中…</div>';
  if (Z) renderZaiko(); else $('items').innerHTML = '<div class="empty">読み込み中…</div>';
  loadResv(); loadZaiko(); flush();
}
function setSec(s) {
  SEC = s; store('bisanStaffSec', s);
  document.querySelectorAll('#seg button').forEach(function (b) { b.classList.toggle('on', b.dataset.sec === s); });
  $('tabsResv').classList.toggle('hide', s !== 'resv'); $('resvView').classList.toggle('hide', s !== 'resv');
  $('tabsZaiko').classList.toggle('hide', s !== 'zaiko'); $('zaikoView').classList.toggle('hide', s !== 'zaiko');
  syncLabel();
}
function setSync(t) { $('sync').textContent = t || ''; }
function syncLabel() { setSync(SEC === 'zaiko' && QUEUE.length ? '在庫を保存中… 残り' + QUEUE.length + '件' : ''); }

/* ========== 予約 ========== */
var R = JSON.parse(store('bisanStaffResv') || 'null'), RTAB = 'pend', REASON_ID = null;
function loadResv() {
  return post({ action: 'admin_list' }).then(function (res) {
    if (!res.ok) throw new Error(res.error);
    if (R) {   // 保存中の予約は画面の状態を優先
      var busy = {}; R.list.forEach(function (x) { if (x.busy) busy[x.id] = x; });
      res.list = res.list.map(function (x) { return busy[x.id] || x; });
    }
    R = res; store('bisanStaffResv', JSON.stringify(R)); renderResv();
  }).catch(function (e) { if (!R) $('resvView').innerHTML = '<div class="empty">予約を読み込めませんでした<br>' + esc(e.message) + '</div>'; });
}
function badge(s) {
  var c = s === '承認待ち' ? 'b-pend' : s === '確定' ? 'b-ok' : s === 'キャンセル待ち' ? 'b-wait' : 'b-off';
  return '<span class="badge ' + c + '">' + esc(s || '—') + '</span>';
}
function btn(cls, label, st, x) {
  return '<button class="' + cls + '" data-set="' + st + '" data-row="' + x.row + '" data-id="' + esc(x.id) + '">' + label + '</button>';
}
function rcard(x) {
  var acts = '';
  if (x.busy) acts = '';
  else if (x.status === '承認待ち') acts = '<div class="acts">' + btn('wt', 'キャンセル待ち', 'キャンセル待ち', x) + btn('ok', '承認して確定', '確定', x) + '</div>';
  else if (x.status === 'キャンセル待ち') acts = '<div class="acts">' + btn('cx', 'キャンセルへ', 'キャンセル', x) + btn('ok', '確定にする', '確定', x) + '</div>';
  else if (x.status === '確定') acts = '<div class="acts">' + btn('cx', 'キャンセルへ', 'キャンセル', x) +
    (x.viaLine && !x.thanks && x.date <= R.today ? '<button class="ok" data-thanks="1" data-row="' + x.row + '" data-id="' + esc(x.id) + '">お礼を今すぐ送る</button>' : '') + '</div>';
  var reasonBox = '';
  if (REASON_ID === x.id && !x.busy) {
    reasonBox = '<div class="reason"><label for="reasonInput">キャンセル理由（必須）</label>' +
      '<textarea id="reasonInput" placeholder="例）お客様から電話でキャンセル／体調不良のため"></textarea>' +
      '<div class="row"><button class="no" data-reason-close="1">やめる</button>' +
      '<button class="go" data-reason-go="1" data-row="' + x.row + '" data-id="' + esc(x.id) + '">キャンセルにする</button></div></div>';
  }
  var meta = [];
  if (x.tel) meta.push('電話 <a href="tel:' + esc(x.tel) + '">' + esc(x.tel) + '</a>');
  if (x.memo) meta.push('ご要望：' + esc(x.memo));
  if (x.left !== null && x.left !== undefined && (x.status === '承認待ち' || x.status === '確定' || x.status === 'キャンセル待ち')) meta.push('この時間の残り席：' + x.left + ' / ' + R.seats);
  meta.push(x.viaLine ? 'LINE予約（' + esc(x.lineName) + '）' : '手入力の予約（LINE通知なし）');
  if (x.by) meta.push('<span class="by">対応：' + esc(x.by) + '</span>');
  if (x.reason) meta.push('キャンセル理由：' + esc(x.reason));
  if (x.busy) meta.push('<b>保存中…</b>');
  if (x.thanks) meta.push('お礼・口コミ案内：送信済み');
  else if (x.status === '確定' && x.viaLine) meta.push('お礼・口コミ案内：来店翌日11時に自動送信');
  var langTag = x.lang === 'en' ? '<span class="lang">英語</span>' : '';
  return '<div class="card"><div class="top"><div class="when">' + esc(x.label) + ' ' + esc(x.time) + '</div>' + langTag + badge(x.status) + '</div>' +
    '<div class="who">' + esc(x.name) + ' 様　' + esc(x.people) + '名</div>' +
    '<div class="meta">' + meta.join('<br>') + '</div>' + acts + reasonBox + '</div>';
}
function opClass(op) { return /確定/.test(op) ? 'o1' : /待ち/.test(op) ? 'o2' : /キャンセル/.test(op) ? 'o3' : 'o4'; }
function renderResv() {
  if (!R) return;
  var t = R.today, L = R.list;
  var future = L.filter(function (x) { return x.date >= t; });
  var g = {
    pend: future.filter(function (x) { return x.status === '承認待ち'; }),
    today: L.filter(function (x) { return x.date === t && (x.status === '確定' || x.status === '承認待ち'); }),
    ok: future.filter(function (x) { return x.status === '確定'; }),
    wait: future.filter(function (x) { return x.status === 'キャンセル待ち'; })
  };
  cnt('cPend', g.pend.length); cnt('cToday', g.today.length); cnt('segResv', g.pend.length);
  if (RTAB === 'hist') {
    var H = R.history || [], h = '', last = '';
    H.forEach(function (r) {
      var d = String(r[0]).slice(0, 10);
      if (d !== last) { last = d; h += '<div class="day">' + esc(dayLabel(d)) + '</div>'; }
      h += '<div class="hist"><div class="t">' + esc(String(r[0]).slice(11)) + '</div><div class="b"><span class="op ' + opClass(r[2]) + '">' + esc(r[2]) + '</span>　' + esc(r[1]) +
        '<small>' + esc(r[6]) + ' 様 ' + esc(r[7]) + '名・' + esc(r[4] ? md(r[4]) : '') + ' ' + esc(r[5]) + (r[8] ? '・理由：' + esc(r[8]) : '') + '</small></div></div>';
    });
    $('resvView').innerHTML = h || '<div class="empty">まだ対応の記録がありません。<br>予約を確定・キャンセル待ち・キャンセルにすると、だれがいつ対応したかがここに残ります。</div>';
    return;
  }
  var list = g[RTAB];
  var empty = { pend: '承認待ちの予約はありません', today: '今日の予約はありません', ok: '確定予約はありません', wait: 'キャンセル待ちはありません' };
  if (!list.length) { $('resvView').innerHTML = '<div class="empty">' + empty[RTAB] + '</div>'; return; }
  var html = '', lastDay = '';
  list.forEach(function (x) {
    if (x.date !== lastDay) { html += '<div class="day">' + esc(x.label) + '</div>'; lastDay = x.date; }
    html += rcard(x);
  });
  $('resvView').innerHTML = html;
}
function rsave(id, row, st, reason) {
  var item = R.list.filter(function (x) { return x.id === id; })[0];
  var before = item ? { status: item.status, reason: item.reason, by: item.by } : null;
  if (item) { item.status = st; item.busy = true; if (reason) item.reason = reason; item.by = st + ' ' + ME.name + ' ' + nowFull().slice(5).replace('-', '/'); }
  REASON_ID = null; renderResv();
  post({ action: 'admin_set', row: row, id: id, status: st, reason: reason || '' }).then(function (res) {
    if (!res.ok) throw new Error(res.error);
    if (item) item.busy = false;
    toast(st + 'にしました' + (res.sent ? '（LINEで連絡しました）' : ''));
    loadResv();
  }).catch(function (err) {
    if (item && before) { item.status = before.status; item.reason = before.reason; item.by = before.by; item.busy = false; renderResv(); }
    toast('保存できませんでした：' + (err.message || 'エラー'));
  });
}

/* ========== 在庫 ========== */
var Z = JSON.parse(store('bisanStaffZaiko') || 'null');
var QUEUE = JSON.parse(store('bisanStaffZQueue') || '[]');
var CAT = 'すべて', OPEN = null, ZTAB = 'list', SENDING = false;
function loadZaiko() {
  return post({ action: 'z_data' }).then(function (res) {
    if (!res.ok) throw new Error(res.error);
    Z = { items: res.items, ins: res.ins || [], recent: res.recent || [] };
    QUEUE.forEach(function (q) { applyLocal(q, true); });
    store('bisanStaffZaiko', JSON.stringify(Z)); renderZaiko();
  }).catch(function (e) { if (!Z) $('items').innerHTML = '<div class="empty">在庫を読み込めませんでした<br>' + esc(e.message) + '</div>'; });
}
function applyOp(stock, q) { var v = q.kind === 'use' ? stock - q.qty : q.kind === 'in' ? stock + q.qty : q.qty; return v < 0 ? 0 : v; }
function applyLocal(q, withRecords) {
  var item = Z.items.filter(function (x) { return x.id === q.id; })[0];
  if (!item) return null;
  item.stock = applyOp(item.stock, q);
  if (q.kind === 'count') item.checked = q.at.slice(0, 10) + ' ' + ME.name;
  if (q.kind === 'in' && (!item.lastIn || q.date > item.lastIn)) item.lastIn = q.date;
  if (withRecords) {
    var label = { use: '使用', in: '入荷', count: '棚卸' }[q.kind];
    Z.recent.unshift([q.at, ME.name, item.cat, item.name, label, '', item.stock, q.kind === 'in' ? '入荷日 ' + q.date : '']);
    if (q.kind === 'in') Z.ins.unshift([q.date, item.name, q.qty, item.stock, ME.name, item.cat, item.id, q.at]);
  }
  return item;
}
function zact(id, kind, qty, date) {
  var q = { id: id, kind: kind, qty: qty, at: nowFull() };
  if (kind === 'in') q.date = date || today();
  var item = applyLocal(q, true);
  if (!item) return;
  QUEUE.push(q); store('bisanStaffZQueue', JSON.stringify(QUEUE));
  OPEN = null; renderZaiko();
  toast(item.name + '：' + item.stock + (kind === 'in' ? '（' + md(q.date) + ' 入荷）' : ''));
  flush();
}
function flush() {
  syncLabel();
  if (SENDING || !QUEUE.length || !TOKEN) return;
  SENDING = true;
  var q = QUEUE[0];
  post({ action: 'z_update', id: q.id, kind: q.kind, qty: q.qty, date: q.date }).then(function (res) {
    SENDING = false;
    QUEUE.shift(); store('bisanStaffZQueue', JSON.stringify(QUEUE));
    if (!res.ok) { toast('保存できませんでした：' + res.error); loadZaiko(); flush(); return; }
    var item = Z.items.filter(function (x) { return x.id === res.id; })[0];
    if (item && !QUEUE.some(function (x) { return x.id === res.id; })) { item.stock = res.stock; item.checked = res.checked; item.lastIn = res.lastIn; }
    store('bisanStaffZaiko', JSON.stringify(Z));
    renderZaiko(); flush();
  }).catch(function () {
    SENDING = false;
    if (!TOKEN) return;
    setSync('電波が弱いため在庫の保存を待っています（残り' + QUEUE.length + '件）。自動で再送します');
    setTimeout(flush, 8000);
  });
}
function isOut(x) { return x.stock <= 0; }
function isLow(x) { return !isOut(x) && x.min !== null && x.stock <= x.min; }
function renderZaiko() {
  if (!Z) return;
  syncLabel();
  var cats = ['すべて'];
  Z.items.forEach(function (x) { if (cats.indexOf(x.cat) < 0) cats.push(x.cat); });
  $('cats').innerHTML = cats.map(function (c) { return '<button class="' + (c === CAT ? 'on' : '') + '" data-cat="' + esc(c) + '">' + esc(c) + '</button>'; }).join('');
  var q = $('q').value.trim();
  var list = Z.items.filter(function (x) { return (CAT === 'すべて' || x.cat === CAT) && (!q || x.name.indexOf(q) >= 0); });
  var pend = {}; QUEUE.forEach(function (x) { pend[x.id] = 1; });
  $('items').innerHTML = list.length ? list.map(function (x) { return zcard(x, pend[x.id]); }).join('') : '<div class="empty">該当する品目がありません</div>';

  var outs = Z.items.filter(isOut), lows = Z.items.filter(isLow), n = outs.length + lows.length;
  cnt('cOut', n); cnt('segZaiko', n);
  var row = function (x) {
    var sub = [x.cat, x.min !== null ? '最低 ' + x.min : '', x.lastIn ? '最終入荷 ' + md(x.lastIn) : '', x.supplier].filter(String).join('・');
    return '<div class="row ' + (isOut(x) ? 'out' : 'low') + '"><div class="n">' + esc(x.name) + '<small>' + esc(sub) + '</small></div><div class="v">在庫<b class="' + (isOut(x) ? 'z' : '') + '">' + x.stock + '</b></div></div>';
  };
  $('zOut').innerHTML = n
    ? (outs.length ? '<div class="grp">在庫切れ（' + outs.length + '）</div>' + outs.map(row).join('') : '') +
      (lows.length ? '<div class="grp">残りわずか・最低在庫数以下（' + lows.length + '）</div>' + lows.map(row).join('') : '')
    : '<div class="empty">在庫切れ・残りわずかの品目はありません。</div>';

  var h = '', last = '';
  Z.ins.slice(0, 100).forEach(function (r) {
    if (r[0] !== last) { last = r[0]; h += '<div class="day">' + esc(dayLabel(r[0])) + '</div>'; }
    h += '<div class="row"><div class="n">' + esc(r[1]) + '<small>' + esc(r[4]) + '・' + esc(r[5]) + '</small></div><div class="v">入荷<b>+' + esc(r[2]) + '</b></div><div class="v">在庫<b>' + esc(r[3]) + '</b></div></div>';
  });
  $('zIn').innerHTML = h || '<div class="empty">まだ入荷の記録がありません。<br>在庫の「入荷」から記録できます。</div>';

  $('zLog').innerHTML = Z.recent.length
    ? '<table><tr><th>日時</th><th>担当</th><th>品目</th><th>内容</th></tr>' + Z.recent.slice(0, 60).map(function (r) {
        var d = r[5] === '' ? '' : Number(r[5]);
        return '<tr><td>' + esc(String(r[0]).replace(/^\d{4}-/, '').replace('-', '/')) + '</td><td>' + esc(r[1]) + '</td><td>' + esc(r[3]) + '</td><td>' + esc(r[4]) + (d === '' ? '' : ' ' + (d > 0 ? '+' : '') + d) + ' → ' + esc(r[6]) + '</td></tr>';
      }).join('') + '</table>'
    : '<div class="empty">まだ記録がありません</div>';
}
function zcard(x, pending) {
  var open = OPEN && OPEN.id === x.id;
  var chk = x.checked ? '確認 ' + String(x.checked).replace(/^\d{4}-(\d\d)-(\d\d)/, function (m, a, b) { return Number(a) + '/' + Number(b); }) : '';
  var sub = [x.unit ? '目安 ' + x.unit : '', x.lastIn ? '最終入荷 ' + md(x.lastIn) : '', chk, x.memo].filter(String).join('・');
  var b = isOut(x) ? '<span class="zb out">在庫切れ</span>' : isLow(x) ? '<span class="zb">残りわずか</span>' : '';
  return '<div class="item' + (isOut(x) ? ' out' : isLow(x) ? ' low' : '') + '">' +
    '<div class="itop"><div class="name">' + esc(x.name) + b + '<small>' + esc(sub) + '</small></div><div class="stock' + (pending ? ' pending' : '') + '">' + x.stock + '</div></div>' +
    '<div class="zacts"><button class="use" data-act="use1" data-id="' + x.id + '">1つ使った（−1）</button>' +
    '<button class="in" data-act="in" data-id="' + x.id + '">入荷</button><button class="cnt" data-act="count" data-id="' + x.id + '">数えた</button></div>' +
    (open && OPEN.kind === 'in' ? '<div class="inbox"><div class="dates"><div><label for="num">入荷した数</label><input id="num" type="number" inputmode="numeric" min="0"></div>' +
      '<div><label for="dlv">入荷日</label><input id="dlv" type="date" value="' + today() + '" max="' + today() + '"></div></div>' +
      '<div class="r2"><button data-act="save" data-id="' + x.id + '">入荷を保存</button><button class="x" data-act="close">やめる</button></div></div>'
    : open ? '<div class="panel"><input id="num" type="number" inputmode="numeric" min="0" aria-label="数" placeholder="今ある数"><button data-act="save" data-id="' + x.id + '">保存</button><button class="x" data-act="close">やめる</button></div>' : '') +
    '</div>';
}

/* ========== 操作 ========== */
function arm(b, label, done) {
  if (b.dataset.armed === '1') return true;
  b.dataset.armed = '1'; b.classList.add('armed'); b.textContent = label;
  setTimeout(function () { if (b.isConnected && b.dataset.armed === '1') { b.dataset.armed = ''; b.classList.remove('armed'); b.textContent = done; } }, 4000);
  return false;
}
document.addEventListener('click', function (e) {
  var b = e.target.closest('button'); if (!b) return;
  // ログイン
  if (b.dataset.key) {
    var k = b.dataset.key;
    if (k === '消す') CODE = CODE.slice(0, -1);
    else if (k === 'OK') { doLogin(); return; }
    else if (CODE.length < 6) { CODE += k; if (CODE.length === 6) { renderDots(); doLogin(); return; } }
    renderDots(); return;
  }
  if (b.dataset.sec) { setSec(b.dataset.sec); window.scrollTo(0, 0); return; }
  // 予約
  if (b.dataset.tab) {
    RTAB = b.dataset.tab; REASON_ID = null;
    document.querySelectorAll('#tabsResv button').forEach(function (n) { n.classList.toggle('on', n === b); });
    renderResv(); window.scrollTo(0, 0); return;
  }
  if (b.dataset.thanks) {
    if (!arm(b, 'もう一度押すと送信', 'お礼を今すぐ送る')) return;
    var it = R.list.filter(function (x) { return x.id === b.dataset.id; })[0];
    if (it) { it.thanks = true; renderResv(); }
    post({ action: 'admin_thanks', row: Number(b.dataset.row), id: b.dataset.id }).then(function (res) {
      if (!res.ok) throw new Error(res.error);
      toast('お礼と口コミのご案内を送りました'); loadResv();
    }).catch(function (err) { if (it) { it.thanks = false; renderResv(); } toast('送れませんでした：' + (err.message || 'エラー')); });
    return;
  }
  if (b.dataset.reasonClose) { REASON_ID = null; renderResv(); return; }
  if (b.dataset.reasonGo) {
    var r = ($('reasonInput').value || '').trim();
    if (!r) { toast('キャンセル理由を入力してください'); $('reasonInput').focus(); return; }
    rsave(b.dataset.id, Number(b.dataset.row), 'キャンセル', r); return;
  }
  if (b.dataset.set) {
    var st = b.dataset.set;
    if (st === 'キャンセル') { REASON_ID = b.dataset.id; renderResv(); var ta = $('reasonInput'); if (ta) ta.focus(); return; }
    if (st === 'キャンセル待ち' && !arm(b, 'もう一度押すとキャンセル待ち', 'キャンセル待ち')) return;
    rsave(b.dataset.id, Number(b.dataset.row), st, ''); return;
  }
  // 在庫
  if (b.dataset.ztab) {
    ZTAB = b.dataset.ztab;
    document.querySelectorAll('#tabsZaiko button').forEach(function (n) { n.classList.toggle('on', n === b); });
    ['list', 'out', 'in', 'log'].forEach(function (v) { $('z' + v.charAt(0).toUpperCase() + v.slice(1)).classList.toggle('hide', v !== ZTAB); });
    window.scrollTo(0, 0); return;
  }
  if (b.dataset.cat) { CAT = b.dataset.cat; OPEN = null; renderZaiko(); return; }
  var a = b.dataset.act, id = b.dataset.id;
  if (a === 'use1') zact(id, 'use', 1);
  else if (a === 'in' || a === 'count') { OPEN = { id: id, kind: a }; renderZaiko(); var n = $('num'); if (n) n.focus(); }
  else if (a === 'close') { OPEN = null; renderZaiko(); }
  else if (a === 'save') {
    var v = $('num').value;
    if (v === '' || Number(v) < 0) { toast('数を入れてください'); return; }
    if (OPEN.kind === 'in') {
      var d = $('dlv').value || today();
      if (d > today()) { toast('入荷日が未来になっています'); return; }
      zact(id, 'in', Number(v), d);
    } else zact(id, OPEN.kind, Number(v));
  }
});
document.addEventListener('keydown', function (e) {
  if (!$('login').classList.contains('hide')) {
    if (/^\d$/.test(e.key) && CODE.length < 6) { CODE += e.key; renderDots(); if (CODE.length === 6) doLogin(); }
    else if (e.key === 'Backspace') { CODE = CODE.slice(0, -1); renderDots(); }
    else if (e.key === 'Enter') doLogin();
    return;
  }
  if (e.key === 'Enter' && e.target && e.target.id === 'num') { var s = document.querySelector('[data-act=save]'); if (s) s.click(); }
});
$('q').addEventListener('input', renderZaiko);
$('logout').addEventListener('click', logout);
$('reload').addEventListener('click', function () { Promise.all([loadResv(), loadZaiko()]).then(function () { toast('更新しました'); }); });
window.addEventListener('online', flush);
setInterval(function () {
  if (!TOKEN || document.hidden) return;
  if (!REASON_ID) loadResv();
  if (!QUEUE.length && !OPEN) loadZaiko();
}, 60000);

if (TOKEN && ME) startApp(); else showLogin();
</script>
</body>
</html>
