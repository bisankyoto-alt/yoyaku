<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Bisan 予約管理</title>
<style>
  :root{--olive:#3F5234;--clay:#8C3B22;--ground:#F6F1E7;--ink:#231F1A;--muted:#5E574D;--line:#DDD3C2;--pend:#F3DCCB;--pendInk:#7A321C;--ok:#DCE5D2;--okInk:#2F3E26;--off:#E6E0D5;--offInk:#4A433A}
  *{box-sizing:border-box}
  body{margin:0;background:var(--ground);color:var(--ink);font-family:"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif}
  header{background:#231F1A;color:var(--ground);padding:16px;position:sticky;top:0;z-index:5}
  .hrow{display:flex;align-items:center;gap:10px;max-width:760px;margin:0 auto}
  header h1{margin:0;font-size:19px;flex:1}
  header button{height:36px;padding:0 12px;border-radius:18px;border:1px solid rgba(246,241,231,.5);background:transparent;color:inherit;font-size:13px}
  .stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;max-width:760px;margin:12px auto 0}
  .stat{border-radius:10px;padding:8px 10px}.stat b{display:block;font-size:22px}.stat span{font-size:11px}
  .s1{background:var(--clay)}.s2{background:var(--olive)}.s3{background:#4A433A}
  nav{display:flex;gap:6px;max-width:760px;margin:12px auto 0}
  nav button{flex:1;height:36px;border-radius:18px;border:1px solid rgba(246,241,231,.5);background:transparent;color:inherit;font-size:14px}
  nav button.on{background:var(--ground);color:var(--ink);font-weight:700}
  main{max-width:760px;margin:0 auto;padding:12px 16px 40px}
  .day{font-size:13px;font-weight:700;color:var(--muted);margin:18px 0 6px}
  .card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;margin-top:10px}
  .top{display:flex;align-items:center;gap:8px}
  .when{flex:1;font-size:17px;font-weight:700}
  .badge{font-size:12px;font-weight:700;padding:4px 10px;border-radius:12px}
  .b-pend{background:var(--pend);color:var(--pendInk)}.b-ok{background:var(--ok);color:var(--okInk)}.b-off{background:var(--off);color:var(--offInk)}
  .who{font-size:15px;margin-top:6px}
  .meta{font-size:13px;color:var(--muted);margin-top:4px;line-height:1.6}
  .meta a{color:var(--clay)}
  .acts{display:flex;gap:8px;margin-top:10px}
  .acts button{height:44px;border-radius:22px;font-size:14px;font-weight:700;cursor:pointer}
  .ok{flex:1;border:none;background:var(--olive);color:#fff}
  .ng{width:110px;border:1px solid #8F877B;background:#fff;color:#4A433A}
  .cx{border:1px solid var(--line);background:#fff;color:var(--muted);padding:0 14px}
  .acts button.armed{background:var(--clay);border-color:var(--clay);color:#fff;width:auto;padding:0 16px}
  .empty{color:var(--muted);text-align:center;padding:40px 0}
  .login{max-width:320px;margin:90px auto;text-align:center;padding:0 16px}
  .login input{width:100%;height:54px;font-size:26px;text-align:center;letter-spacing:.3em;border:1px solid #BFB4A2;border-radius:12px;margin:14px 0}
  .login button{width:100%;height:50px;border-radius:25px;border:none;background:var(--olive);color:#fff;font-size:16px;font-weight:700}
  .err{color:var(--clay);font-weight:700;margin-top:10px}
  .toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:20px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none}
  .toast.show{opacity:1}
  .hide{display:none!important}
</style>
</head>
<body>

<section id="login" class="login">
  <h2>Bisan 予約管理</h2>
  <label for="pin">管理PIN（6桁）</label>
  <input id="pin" type="password" inputmode="numeric" autocomplete="off" maxlength="6">
  <button id="loginBtn">開く</button>
  <div class="err" id="loginErr"></div>
</section>

<div id="app" class="hide">
  <header>
    <div class="hrow"><h1>Bisan 予約管理</h1><button id="reload">更新</button><button id="logout">閉じる</button></div>
    <div class="stats">
      <div class="stat s1"><span>承認待ち</span><b id="cPend">0</b></div>
      <div class="stat s2"><span>今日の確定</span><b id="cToday">0</b></div>
      <div class="stat s3"><span>今後の確定</span><b id="cOk">0</b></div>
    </div>
    <nav>
      <button data-tab="pend" class="on">承認待ち</button>
      <button data-tab="today">今日</button>
      <button data-tab="all">今後すべて</button>
    </nav>
  </header>
  <main id="list"></main>
</div>
<div class="toast" id="toast"></div>

<script>
var GAS_URL = 'https://script.google.com/macros/s/AKfycbwHymunhy03Jy9Ud4jxqqbuO7kQfmx45LUVUsu6z4Ipw56S_3H4XbPa27XFZqUaR1k/exec';
var PIN = '', DATA = null, TAB = 'pend';
var $ = function (id) { return document.getElementById(id); };
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function toast(t) { var el = $('toast'); el.textContent = t; el.classList.add('show'); setTimeout(function () { el.classList.remove('show'); }, 2000); }
function ss(k, v) { try { if (v === undefined) return sessionStorage.getItem(k); if (v === null) sessionStorage.removeItem(k); else sessionStorage.setItem(k, v); } catch (e) { return null; } }

function post(body) {
  body.pin = PIN;
  return fetch(GAS_URL, { method: 'POST', body: JSON.stringify(body) }).then(function (r) { return r.json(); });
}

function load() {
  return post({ action: 'admin_list' }).then(function (res) {
    if (!res.ok) throw new Error(res.error);
    DATA = res; render();
  });
}

function login() {
  PIN = $('pin').value.trim();
  $('loginErr').textContent = '読み込み中…';
  load().then(function () {
    ss('bisanAdminPin', PIN);
    $('login').classList.add('hide'); $('app').classList.remove('hide');
    $('loginErr').textContent = '';
  }).catch(function (e) { $('loginErr').textContent = e.message; PIN = ''; });
}

function badge(s) {
  var c = s === '承認待ち' ? 'b-pend' : s === '確定' ? 'b-ok' : 'b-off';
  return '<span class="badge ' + c + '">' + esc(s || '—') + '</span>';
}

function card(x) {
  var acts = '';
  if (x.status === '承認待ち') {
    acts = '<div class="acts"><button class="ng" data-set="お断り" data-row="' + x.row + '" data-id="' + esc(x.id) + '">お断り</button>' +
      '<button class="ok" data-set="確定" data-row="' + x.row + '" data-id="' + esc(x.id) + '">承認して確定</button></div>';
  } else if (x.status === '確定') {
    acts = '<div class="acts"><button class="cx" data-set="キャンセル" data-row="' + x.row + '" data-id="' + esc(x.id) + '">キャンセルにする</button></div>';
  }
  var meta = [];
  if (x.tel) meta.push('電話 <a href="tel:' + esc(x.tel) + '">' + esc(x.tel) + '</a>');
  if (x.memo) meta.push('ご要望：' + esc(x.memo));
  if (x.left !== null && x.left !== undefined && x.status !== 'キャンセル' && x.status !== 'お断り') meta.push('この時間の残り席：' + x.left + ' / ' + DATA.seats);
  meta.push(x.viaLine ? 'LINE予約（' + esc(x.lineName) + '）' : '手入力の予約（LINE通知なし）');
  if (x.busy) meta.push('<b>保存中…</b>');
  else if (x.sent) meta.push('通知済み：' + esc(x.sent));
  return '<div class="card"><div class="top"><div class="when">' + esc(x.label) + ' ' + esc(x.time) + '</div>' + badge(x.status) + '</div>' +
    '<div class="who">' + esc(x.name) + ' 様　' + esc(x.people) + '名</div>' +
    '<div class="meta">' + meta.join('<br>') + '</div>' + acts + '</div>';
}

function render() {
  var t = DATA.today, L = DATA.list;
  var pend = L.filter(function (x) { return x.status === '承認待ち' && x.date >= t; });
  var today = L.filter(function (x) { return x.date === t && x.status !== 'お断り' && x.status !== 'キャンセル'; });
  var all = L.filter(function (x) { return x.date >= t; });
  $('cPend').textContent = pend.length;
  $('cToday').textContent = today.filter(function (x) { return x.status === '確定'; }).length;
  $('cOk').textContent = all.filter(function (x) { return x.status === '確定'; }).length;
  var list = TAB === 'pend' ? pend : TAB === 'today' ? today : all;
  if (!list.length) {
    $('list').innerHTML = '<div class="empty">' + (TAB === 'pend' ? '承認待ちの予約はありません' : '予約はありません') + '</div>';
    return;
  }
  var html = '', lastDay = '';
  list.forEach(function (x) {
    if (x.date !== lastDay) { html += '<div class="day">' + esc(x.label) + '</div>'; lastDay = x.date; }
    html += card(x);
  });
  $('list').innerHTML = html;
}

document.addEventListener('click', function (e) {
  var b = e.target.closest('button'); if (!b) return;
  if (b.dataset.tab) {
    TAB = b.dataset.tab;
    document.querySelectorAll('nav button').forEach(function (n) { n.classList.toggle('on', n === b); });
    render(); return;
  }
  if (b.dataset.set) {
    var st = b.dataset.set;
    // お断り・キャンセルは誤操作防止のため2回押しで実行（ブラウザの確認ウィンドウは使わない）
    if (st !== '確定' && b.dataset.armed !== '1') {
      b.dataset.armed = '1'; b.classList.add('armed'); b.textContent = 'もう一度押すと' + st;
      setTimeout(function () { if (b.isConnected && b.dataset.armed === '1') { b.dataset.armed = ''; b.classList.remove('armed'); b.textContent = st === 'お断り' ? 'お断り' : 'キャンセルにする'; } }, 4000);
      return;
    }
    // 画面はすぐ切り替え、保存は裏で行う
    var item = DATA.list.filter(function (x) { return x.id === b.dataset.id; })[0];
    var before = item ? item.status : null;
    if (item) { item.status = st; item.busy = true; render(); }
    post({ action: 'admin_set', row: Number(b.dataset.row), id: b.dataset.id, status: st }).then(function (res) {
      if (!res.ok) throw new Error(res.error);
      if (item) { item.busy = false; if (res.sent) item.sent = '送信済み'; render(); }
      toast(st + 'にしました' + (res.sent ? '（LINEで連絡しました）' : ''));
    }).catch(function (err) {
      if (item) { item.status = before; item.busy = false; render(); }
      toast('保存できませんでした：' + (err.message || 'エラー'));
    });
  }
});
$('loginBtn').addEventListener('click', login);
$('pin').addEventListener('keydown', function (e) { if (e.key === 'Enter') login(); });
$('reload').addEventListener('click', function () { load().then(function () { toast('更新しました'); }).catch(function (e) { toast(e.message); }); });
$('logout').addEventListener('click', function () { ss('bisanAdminPin', null); location.reload(); });
setInterval(function () { if (PIN && !document.hidden) load().catch(function () {}); }, 60000);
var saved = ss('bisanAdminPin'); if (saved) { $('pin').value = saved; login(); }
</script>
</body>
</html>
