<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Bisan 予約管理</title>
<style>
  :root{--olive:#3F5234;--clay:#8C3B22;--wait:#A0612F;--ground:#F6F1E7;--ink:#231F1A;--muted:#5E574D;--line:#DDD3C2;--pend:#F3DCCB;--pendInk:#7A321C;--ok:#DCE5D2;--okInk:#2F3E26;--waitBg:#F1E0CC;--waitInk:#6E3F17;--off:#E6E0D5;--offInk:#4A433A}
  *{box-sizing:border-box}
  body{margin:0;background:var(--ground);color:var(--ink);font-family:"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif}
  header{background:#231F1A;color:var(--ground);padding:16px;position:sticky;top:0;z-index:5}
  .hrow{display:flex;align-items:center;gap:10px;max-width:760px;margin:0 auto}
  header h1{margin:0;font-size:19px;flex:1}
  header button{height:36px;padding:0 12px;border-radius:18px;border:1px solid rgba(246,241,231,.5);background:transparent;color:inherit;font-size:13px;cursor:pointer}
  .stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;max-width:760px;margin:12px auto 0}
  .stat{border-radius:10px;padding:8px 10px}.stat b{display:block;font-size:22px}.stat span{font-size:11px}
  .s1{background:var(--clay)}.s2{background:var(--olive)}.s3{background:#4A433A}.s4{background:var(--wait)}
  nav{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;max-width:760px;margin:12px auto 0}
  nav button{height:38px;border-radius:19px;border:1px solid rgba(246,241,231,.5);background:transparent;color:inherit;font-size:13px;cursor:pointer}
  nav button.on{background:var(--ground);color:var(--ink);font-weight:700}
  main{max-width:760px;margin:0 auto;padding:12px 16px 40px}
  .day{font-size:13px;font-weight:700;color:var(--muted);margin:18px 0 6px}
  .card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;margin-top:10px}
  .top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .when{flex:1;font-size:17px;font-weight:700}
  .badge{font-size:12px;font-weight:700;padding:4px 10px;border-radius:12px}
  .b-pend{background:var(--pend);color:var(--pendInk)}.b-ok{background:var(--ok);color:var(--okInk)}.b-wait{background:var(--waitBg);color:var(--waitInk)}.b-off{background:var(--off);color:var(--offInk)}
  .lang{font-size:11px;font-weight:700;padding:3px 8px;border-radius:10px;background:#E4E9F2;color:#2E3F5C}
  .who{font-size:15px;margin-top:6px}
  .meta{font-size:13px;color:var(--muted);margin-top:4px;line-height:1.6}
  .meta a{color:var(--clay)}
  .acts{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
  .acts button{height:44px;border-radius:22px;font-size:14px;font-weight:700;cursor:pointer;padding:0 16px}
  .ok{flex:1;border:none;background:var(--olive);color:#fff}
  .wt{border:1px solid var(--wait);background:#fff;color:var(--wait)}
  .cx{border:1px solid #8F877B;background:#fff;color:#4A433A}
  .acts button.armed{background:var(--wait);border-color:var(--wait);color:#fff}
  .reason{margin-top:10px;background:#FBF7F1;border:1px solid var(--line);border-radius:10px;padding:10px}
  .reason label{display:block;font-size:13px;font-weight:700;margin-bottom:6px}
  .reason textarea{width:100%;border:1px solid #BFB4A2;border-radius:8px;padding:8px 10px;font:inherit;font-size:15px;resize:vertical;min-height:64px}
  .reason .row{display:flex;gap:8px;margin-top:8px}
  .reason .go{flex:1;height:42px;border:none;border-radius:21px;background:#4A433A;color:#fff;font-weight:700;font-size:14px;cursor:pointer}
  .reason .no{height:42px;border:1px solid var(--line);border-radius:21px;background:#fff;color:var(--muted);padding:0 16px;cursor:pointer}
  .empty{color:var(--muted);text-align:center;padding:40px 0}
  .login{max-width:320px;margin:90px auto;text-align:center;padding:0 16px}
  .login input{width:100%;height:54px;font-size:26px;text-align:center;letter-spacing:.3em;border:1px solid #BFB4A2;border-radius:12px;margin:14px 0}
  .login button{width:100%;height:50px;border-radius:25px;border:none;background:var(--olive);color:#fff;font-size:16px;font-weight:700;cursor:pointer}
  .err{color:var(--clay);font-weight:700;margin-top:10px}
  .toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:20px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:10}
  .toast.show{opacity:1}
  .hide{display:none!important}
</style>
</head>
<body>

<section id="login" class="login">
  <h2>Bisan 予約管理</h2>
  <label for="pin">管理PIN（6桁）</label>
  <input id="pin" type="password" inputmode="numeric" autocomplete="off" maxlength="6">
  <button id="loginBtn">開く</button>
  <div class="err" id="loginErr"></div>
</section>

<div id="app" class="hide">
  <header>
    <div class="hrow"><h1>Bisan 予約管理</h1><button id="reload">更新</button><button id="logout">閉じる</button></div>
    <div class="stats">
      <div class="stat s1"><span>承認待ち</span><b id="cPend">0</b></div>
      <div class="stat s2"><span>今日の予約</span><b id="cToday">0</b></div>
      <div class="stat s3"><span>確定予約</span><b id="cOk">0</b></div>
      <div class="stat s4"><span>キャンセル待ち</span><b id="cWait">0</b></div>
    </div>
    <nav>
      <button data-tab="pend" class="on">承認待ち</button>
      <button data-tab="today">今日の予約</button>
      <button data-tab="ok">確定予約</button>
      <button data-tab="wait">キャンセル待ち</button>
    </nav>
  </header>
  <main id="list"></main>
</div>
<div class="toast" id="toast"></div>

<script>
var GAS_URL = 'https://script.google.com/macros/s/AKfycbwHymunhy03Jy9Ud4jxqqbuO7kQfmx45LUVUsu6z4Ipw56S_3H4XbPa27XFZqUaR1k/exec';
var PIN = '', DATA = null, TAB = 'pend', REASON_ID = null;
var $ = function (id) { return document.getElementById(id); };
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function toast(t) { var el = $('toast'); el.textContent = t; el.classList.add('show'); setTimeout(function () { el.classList.remove('show'); }, 2200); }
function ss(k, v) { try { if (v === undefined) return sessionStorage.getItem(k); if (v === null) sessionStorage.removeItem(k); else sessionStorage.setItem(k, v); } catch (e) { return null; } }

function post(body) {
  body.pin = PIN;
  return fetch(GAS_URL, { method: 'POST', body: JSON.stringify(body) }).then(function (r) { return r.json(); });
}

function load() {
  return post({ action: 'admin_list' }).then(function (res) {
    if (!res.ok) throw new Error(res.error);
    // 保存中の項目は画面の状態を優先
    if (DATA) {
      var busy = {}; DATA.list.forEach(function (x) { if (x.busy) busy[x.id] = x; });
      res.list = res.list.map(function (x) { return busy[x.id] || x; });
    }
    DATA = res; render();
  });
}

function login() {
  PIN = $('pin').value.trim();
  $('loginErr').textContent = '読み込み中…';
  load().then(function () {
    ss('bisanAdminPin', PIN);
    $('login').classList.add('hide'); $('app').classList.remove('hide');
    $('loginErr').textContent = '';
  }).catch(function (e) { $('loginErr').textContent = e.message; PIN = ''; });
}

function badge(s) {
  var c = s === '承認待ち' ? 'b-pend' : s === '確定' ? 'b-ok' : s === 'キャンセル待ち' ? 'b-wait' : 'b-off';
  return '<span class="badge ' + c + '">' + esc(s || '—') + '</span>';
}

function btn(cls, label, st, x) {
  return '<button class="' + cls + '" data-set="' + st + '" data-row="' + x.row + '" data-id="' + esc(x.id) + '">' + label + '</button>';
}

function card(x) {
  var acts = '';
  if (x.busy) acts = '';
  else if (x.status === '承認待ち') acts = '<div class="acts">' + btn('wt', 'キャンセル待ち', 'キャンセル待ち', x) + btn('ok', '承認して確定', '確定', x) + '</div>';
  else if (x.status === 'キャンセル待ち') acts = '<div class="acts">' + btn('cx', 'キャンセルへ', 'キャンセル', x) + btn('ok', '確定にする', '確定', x) + '</div>';
  else if (x.status === '確定') acts = '<div class="acts">' + btn('cx', 'キャンセルへ', 'キャンセル', x) +
    (x.viaLine && !x.thanks && x.date <= DATA.today ? '<button class="ok" data-thanks="1" data-row="' + x.row + '" data-id="' + esc(x.id) + '">お礼を今すぐ送る</button>' : '') + '</div>';

  var reasonBox = '';
  if (REASON_ID === x.id && !x.busy) {
    reasonBox = '<div class="reason"><label for="reasonInput">キャンセル理由（必須）</label>' +
      '<textarea id="reasonInput" placeholder="例）お客様から電話でキャンセル／体調不良のため"></textarea>' +
      '<div class="row"><button class="no" data-reason-close="1">やめる</button>' +
      '<button class="go" data-reason-go="1" data-row="' + x.row + '" data-id="' + esc(x.id) + '">キャンセルにする</button></div></div>';
  }

  var meta = [];
  if (x.tel) meta.push('電話 <a href="tel:' + esc(x.tel) + '">' + esc(x.tel) + '</a>');
  if (x.memo) meta.push('ご要望：' + esc(x.memo));
  if (x.left !== null && x.left !== undefined && (x.status === '承認待ち' || x.status === '確定' || x.status === 'キャンセル待ち')) meta.push('この時間の残り席：' + x.left + ' / ' + DATA.seats);
  meta.push(x.viaLine ? 'LINE予約（' + esc(x.lineName) + '）' : '手入力の予約（LINE通知なし）');
  if (x.reason) meta.push('キャンセル理由：' + esc(x.reason));
  if (x.busy) meta.push('<b>保存中…</b>');
  else if (x.sent) meta.push('通知済み：' + esc(x.sent));
  if (x.thanks) meta.push('お礼・口コミ案内：送信済み');
  else if (x.status === '確定' && x.viaLine) meta.push('お礼・口コミ案内：来店翌日11時に自動送信');
  var langTag = x.lang === 'en' ? '<span class="lang">英語</span>' : '';
  return '<div class="card"><div class="top"><div class="when">' + esc(x.label) + ' ' + esc(x.time) + '</div>' + langTag + badge(x.status) + '</div>' +
    '<div class="who">' + esc(x.name) + ' 様　' + esc(x.people) + '名</div>' +
    '<div class="meta">' + meta.join('<br>') + '</div>' + acts + reasonBox + '</div>';
}

function render() {
  var t = DATA.today, L = DATA.list;
  var future = L.filter(function (x) { return x.date >= t; });
  var groups = {
    pend: future.filter(function (x) { return x.status === '承認待ち'; }),
    today: L.filter(function (x) { return x.date === t && (x.status === '確定' || x.status === '承認待ち'); }),
    ok: future.filter(function (x) { return x.status === '確定'; }),
    wait: future.filter(function (x) { return x.status === 'キャンセル待ち'; })
  };
  $('cPend').textContent = groups.pend.length;
  $('cToday').textContent = groups.today.length;
  $('cOk').textContent = groups.ok.length;
  $('cWait').textContent = groups.wait.length;
  var list = groups[TAB];
  var empty = { pend: '承認待ちの予約はありません', today: '今日の予約はありません', ok: '確定予約はありません', wait: 'キャンセル待ちはありません' };
  if (!list.length) { $('list').innerHTML = '<div class="empty">' + empty[TAB] + '</div>'; return; }
  var html = '', lastDay = '';
  list.forEach(function (x) {
    if (x.date !== lastDay) { html += '<div class="day">' + esc(x.label) + '</div>'; lastDay = x.date; }
    html += card(x);
  });
  $('list').innerHTML = html;
}

function save(id, row, st, reason) {
  var item = DATA.list.filter(function (x) { return x.id === id; })[0];
  var before = item ? { status: item.status, reason: item.reason } : null;
  if (item) { item.status = st; item.busy = true; if (reason) item.reason = reason; }
  REASON_ID = null; render();
  post({ action: 'admin_set', row: row, id: id, status: st, reason: reason || '' }).then(function (res) {
    if (!res.ok) throw new Error(res.error);
    if (item) { item.busy = false; if (res.sent) item.sent = st + 'を送信済み'; render(); }
    toast(st + 'にしました' + (res.sent ? '（LINEで連絡しました）' : ''));
  }).catch(function (err) {
    if (item && before) { item.status = before.status; item.reason = before.reason; item.busy = false; render(); }
    toast('保存できませんでした：' + (err.message || 'エラー'));
  });
}

document.addEventListener('click', function (e) {
  var b = e.target.closest('button'); if (!b) return;
  if (b.dataset.tab) {
    TAB = b.dataset.tab; REASON_ID = null;
    document.querySelectorAll('nav button').forEach(function (n) { n.classList.toggle('on', n === b); });
    render(); return;
  }
  if (b.dataset.thanks) {
    if (b.dataset.armed !== '1') {
      b.dataset.armed = '1'; b.classList.add('armed'); b.textContent = 'もう一度押すと送信';
      setTimeout(function () { if (b.isConnected && b.dataset.armed === '1') { b.dataset.armed = ''; b.classList.remove('armed'); b.textContent = 'お礼を今すぐ送る'; } }, 4000);
      return;
    }
    var it = DATA.list.filter(function (x) { return x.id === b.dataset.id; })[0];
    if (it) { it.thanks = true; render(); }
    post({ action: 'admin_thanks', row: Number(b.dataset.row), id: b.dataset.id }).then(function (res) {
      if (!res.ok) throw new Error(res.error);
      toast('お礼と口コミのご案内を送りました');
    }).catch(function (err) { if (it) { it.thanks = false; render(); } toast('送れませんでした：' + (err.message || 'エラー')); });
    return;
  }
  if (b.dataset.reasonClose) { REASON_ID = null; render(); return; }
  if (b.dataset.reasonGo) {
    var r = ($('reasonInput').value || '').trim();
    if (!r) { toast('キャンセル理由を入力してください'); $('reasonInput').focus(); return; }
    save(b.dataset.id, Number(b.dataset.row), 'キャンセル', r); return;
  }
  if (b.dataset.set) {
    var st = b.dataset.set;
    if (st === 'キャンセル') { REASON_ID = b.dataset.id; render(); var ta = $('reasonInput'); if (ta) ta.focus(); return; }
    // キャンセル待ちは誤操作防止のため2回押しで実行（ブラウザの確認ウィンドウは使わない）
    if (st === 'キャンセル待ち' && b.dataset.armed !== '1') {
      b.dataset.armed = '1'; b.classList.add('armed'); b.textContent = 'もう一度押すとキャンセル待ち';
      setTimeout(function () { if (b.isConnected && b.dataset.armed === '1') { b.dataset.armed = ''; b.classList.remove('armed'); b.textContent = 'キャンセル待ち'; } }, 4000);
      return;
    }
    save(b.dataset.id, Number(b.dataset.row), st, '');
  }
});
$('loginBtn').addEventListener('click', login);
$('pin').addEventListener('keydown', function (e) { if (e.key === 'Enter') login(); });
$('reload').addEventListener('click', function () { load().then(function () { toast('更新しました'); }).catch(function (e) { toast(e.message); }); });
$('logout').addEventListener('click', function () { ss('bisanAdminPin', null); location.reload(); });
setInterval(function () { if (PIN && !document.hidden && !REASON_ID) load().catch(function () {}); }, 60000);
var saved = ss('bisanAdminPin'); if (saved) { $('pin').value = saved; login(); }
</script>
</body>
</html>
